name: Build
on:
  workflow_dispatch:

jobs:
  cleanup:
    name: Cleanup Old Runs
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:

    - name: Delete Old Workflow Runs and Artifacts
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        KEEP_COUNT: '3'
      run: |
        set -euo pipefail
        echo "仓库：$REPO，保留最近 $KEEP_COUNT 次成功构建"

        # 1) 收集历史运行，保留最近 KEEP_COUNT 次成功运行，其余待删
        gh api --paginate "repos/$REPO/actions/runs?per_page=100" \
          --jq '.workflow_runs[] | "\(.id)\t\(.status)\t\(.conclusion)"' > runs.tsv || true

        total=$(wc -l < runs.tsv || echo 0)
        echo "历史运行总数：$total"

        kept=0
        to_delete=()
        while IFS=$'\t' read -r id status conclusion; do
          [ -z "${id:-}" ] && continue
          if [ "$status" = "completed" ] && [ "$conclusion" = "success" ] && [ "$kept" -lt "$KEEP_COUNT" ]; then
            kept=$((kept + 1))
            echo "  保留 #$id（第 $kept 次成功运行）"
            continue
          fi
          # 保留进行中的运行，避免打断
          if [ "$status" != "completed" ]; then
            echo "  跳过 #$id（$status，未完成）"
            continue
          fi
          to_delete+=("$id")
        done < runs.tsv

        echo "待删除运行数：${#to_delete[@]}"
        for id in "${to_delete[@]}"; do
          echo "  删除 run #$id"
          gh api -X DELETE "repos/$REPO/actions/runs/$id" || echo "    删除失败（可能已不存在）"
        done

        # 2) 清理已失效的 artifact（运行被删后残留的）
        gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
          --jq '.artifacts[] | select(.expired == true) | .id' | while read -r aid; do
            [ -z "${aid:-}" ] && continue
            echo "  删除过期 artifact #$aid"
            gh api -X DELETE "repos/$REPO/actions/artifacts/$aid" || true
          done

        echo "清理完成"

  build:
    name: Build
    needs: cleanup
    runs-on: windows-latest
    strategy:  
       matrix:  
         configuration: [Debug, Release]

    steps:

    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
        submodules: true

    - name: Set Describe
      shell: bash
      run: |
          describe=`git describe --tags --always`
          echo "describe=$describe" >> $GITHUB_ENV

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3
      with:
        msbuild-architecture: x64
    
    - name: Update Help
      run:  |
        Set-Location ..
        git clone https://github.com/LTCatt/PCL2Help.git -b master --single-branch --depth 1
        Set-Location PCL2Help
        Remove-Item -Path *.* -Recurse -Force
        Compress-Archive -Path .\* -DestinationPath .\Help.zip
        Copy-Item -Path .\Help.zip -Destination "${{ GITHUB.WORKSPACE }}\Plain Craft Launcher 2\Resources\Help.zip" -Force
        Set-Location ..
        Remove-Item PCL2Help -Recurse -Force
        Set-Location ${{ GITHUB.WORKSPACE }}


    - name: Replace
      env:
        PCL_CLIENT_ID: ${{ secrets.CLIENT_ID }}
        PCL_CURSEFORGE_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      run: |
        $cid = $env:PCL_CLIENT_ID
        if ([string]::IsNullOrWhiteSpace($cid)) {
          Write-Host "::warning title=CLIENT_ID 未配置::仓库 Secrets 中没有 CLIENT_ID，将沿用源码内置值。如需覆盖请到 Settings > Secrets and variables > Actions 添加。"
          $cid = '2e83bd78-5f84-43da-ad36-2eac4a04f1c9'
        }
        $cf = $env:PCL_CURSEFORGE_KEY
        if ([string]::IsNullOrWhiteSpace($cf)) { $cf = '' }

        $path = "Plain Craft Launcher 2\Modules\ModSecret.vb"
        $text = Get-Content $path -Raw -Encoding UTF8
        $text = $text -replace 'Public OAuthClientId As String = If\(Environment\.GetEnvironmentVariable\("PCL_MS_CLIENT_ID"\), "[^"]*"\)', ('Public OAuthClientId As String = If(Environment.GetEnvironmentVariable("PCL_MS_CLIENT_ID"), "' + $cid + '")')
        $text = $text -replace 'Public CurseForgeAPIKey As String = If\(Environment\.GetEnvironmentVariable\("PCL_CURSEFORGE_API_KEY"\), "[^"]*"\)', ('Public CurseForgeAPIKey As String = If(Environment.GetEnvironmentVariable("PCL_CURSEFORGE_API_KEY"), "' + $cf + '")')
        [IO.File]::WriteAllText((Resolve-Path $path), $text, (New-Object Text.UTF8Encoding($false)))

        $path2 = "Plain Craft Launcher 2\Modules\Base\ModBase.vb"
        $text2 = Get-Content $path2 -Raw -Encoding UTF8
        $text2 = $text2 -replace 'Public Const CommitHash As String = "[^"]*"', ('Public Const CommitHash As String = "' + '${{ github.sha }}' + '"')
        [IO.File]::WriteAllText((Resolve-Path $path2), $text2, (New-Object Text.UTF8Encoding($false)))

        Write-Host "替换后校验："
        Select-String -Path $path -Pattern 'OAuthClientId As String' | ForEach-Object { $_.Line.Trim() }
        Select-String -Path $path2 -Pattern 'CommitHash As String' | ForEach-Object { $_.Line.Trim() }
        
    - name: Restore NuGet Packages
      run: dotnet restore PCLCS\PCLCS.csproj

    - name: Build
      run: msbuild "Plain Craft Launcher 2\Plain Craft Launcher 2.vbproj" -p:Configuration=${{ matrix.configuration }}

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.configuration }} ${{ env.describe }}
        path: Plain Craft Launcher 2\obj\${{ matrix.configuration }}\Plain Craft Launcher 2.exe
